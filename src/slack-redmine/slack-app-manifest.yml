# Slack app manifest for slack-redmine.
# Use at api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: Redmine Ticket
  description: Create a Redmine ticket from a Slack message
  background_color: "#b71c1c"
features:
  bot_user:
    display_name: redmine-ticket
    always_online: true
  shortcuts:
    - name: Create Redmine ticket
      type: message
      callback_id: create_redmine_ticket
      description: Create a Redmine ticket from this message
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - users:read
      - users:read.email
      - im:write
      - channels:read
      - groups:read
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
